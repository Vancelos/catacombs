<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CATACOMBS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="xhair"></div>
    <div id="dmg-flash"></div>

    <div id="health-wrap">
      <div id="health-label">Health</div>
      <div id="health-bar">
        <div id="health-fill" style="width:100%"></div>
      </div>
      <div id="health-num">100</div>
    </div>

    <div id="ammo-wrap">
      <div id="ammo-label">Ammo</div>
      <div id="ammo-num"><span id="ammo-cur">6</span></div>
      <div id="ammo-total" id="ammo-res">/ 48</div>
      <div id="reload-bar-wrap">
        <div id="reload-label">Reloading</div>
        <div id="reload-bar">
          <div id="reload-fill"></div>
        </div>
      </div>
    </div>

    <div id="wave-wrap">
      <div id="wave-num">CATACOMBS</div>
      <div id="score-num" id="score-el">0 pts</div>
    </div>

    <div id="wave-info" style="position: absolute; top: 60px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 10;">
      <div id="enemies-alive" style="font-size: 11px; color: #ff5555; letter-spacing: 2px;">ENEMIES ALIVE: 0</div>
      <div id="wave-timer" style="font-size: 11px; color: #aaaaaa; letter-spacing: 2px; display: none;">NEXT WAVE IN: 0.0s</div>
    </div>

    <div id="minimap">
      <canvas id="mm-canvas" width="88" height="88"></canvas>
    </div>
    <div id="killfeed"></div>
  </div>

  <div id="overlay">
    <div id="ov-title">CATACOMBS</div>
    <div id="ov-sub">
      Something awakens in the depths.<br>
      Survive. Find the exit.<br><br>
      WASD — Move &nbsp;·&nbsp; Mouse — Look &nbsp;·&nbsp; Click — Shoot<br>
      R — Reload &nbsp;·&nbsp; Shift — Sprint
    </div>
    <div id="ov-score" style="display:none"></div>
    <button id="ov-btn" onclick="startGame()" disabled>LOADING ASSETS...</button>
  </div>

  <div id="lock-msg">Click to capture mouse</div>

  <div id="level-flash">
    <div id="level-title">LEVEL 2</div>
    <div id="level-sub">THE OSSUARY</div>
  </div>

  <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
      }
    }
  </script>

  <script type="module" src="js/script.js"></script>
</body>
</html>
